<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alliance Global Bank</title>
    <script>
      // Redirect all 404 paths back to index.html with hash for SPA routing
      // This makes /admin work on static hosts like InfinityFree
      var path = window.location.pathname;
      if (path.startsWith('/admin')) {
        window.location.href = '/#' + path.substring(1);
      } else {
        window.location.href = '/#' + (path === '/' ? '' : path.substring(1));
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
